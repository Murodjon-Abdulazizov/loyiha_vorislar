<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hayvonlar Akademiyasi - Mobile Premium</title>
    <style>
        :root {
            --primary: #6c5ce7;
            --success: #00b894;
            --danger: #ff7675;
            --bg: #f0f3f7;
            --white: #ffffff;
            --dark: #2d3436;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background: var(--bg);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0; padding: 10px;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh;
        }

        h1 { color: var(--primary); text-align: center; margin: 10px 0 20px; font-size: 1.6rem; }

        /* MENU */
        .menu-container {
            display: grid; 
            grid-template-columns: repeat(2, 1fr); /* Telefonda 2 ustun */
            gap: 12px; 
            width: 100%; 
            max-width: 500px;
        }

        .menu-btn {
            padding: 20px 10px; border: none; border-radius: 20px; color: white;
            font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
        }
        .menu-btn:active { transform: scale(0.95); }

        .btn-uy { background: linear-gradient(135deg, #55efc4, #00b894); }
        .btn-yovvoyi { background: linear-gradient(135deg, #fab1a0, #ff7675); }
        .btn-test { background: linear-gradient(135deg, #ffeaa7, #fdcb6e); color: var(--dark); }
        .btn-sort { background: linear-gradient(135deg, #81ecec, #00cec9); color: var(--dark); }
        .btn-count { background: linear-gradient(135deg, #a29bfe, #6c5ce7); }
        .btn-shadow { background: linear-gradient(135deg, #fd79a8, #e84393); }

        /* GAME AREA */
        #game-area { display: none; width: 100%; max-width: 600px; }
        
        .top-bar {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--white); padding: 10px 15px; border-radius: 15px;
            margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .back-btn { 
            border: none; background: #dfe6e9; padding: 8px 12px; 
            border-radius: 10px; font-weight: bold; cursor: pointer; 
        }

        /* BOARD & CARDS */
        .board { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); /* Telefonda 2 tadan rasm */
            gap: 10px; 
        }

        .card {
            background: var(--white); padding: 12px; border-radius: 18px; text-align: center;
            cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: 3px solid transparent;
        }
        .card img { width: 100%; height: 100px; object-fit: contain; }
        .card p { margin: 8px 0 0; font-size: 0.9rem; font-weight: bold; color: var(--dark); }

        /* SPECIAL VIEWS */
        .shadow-target-box { background: white; padding: 20px; border-radius: 20px; margin-bottom: 15px; }
        .shadow-img { width: 120px; height: 120px; object-fit: contain; }

        .sort-card {
            flex: 1; height: 100px; border-radius: 20px; 
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            border: 4px solid white; box-shadow: 0 5px 10px rgba(0,0,0,0.1); overflow: hidden;
        }
        .sort-card img { width: 100%; height: 70%; object-fit: cover; }
        .sort-card span { font-weight: bold; color: white; font-size: 0.8rem; }

        .mystery-box { width: 200px; height: 200px; margin: 0 auto; background: white; border-radius: 30px; display: flex; align-items: center; justify-content: center; }
        .mystery-img { width: 80%; height: 80%; object-fit: contain; opacity: 0; }
        .blur { filter: blur(30px) grayscale(100%); }
        .reveal { filter: blur(0) grayscale(0); opacity: 1 !important; transition: 0.8s; }

        /* OVERLAYS */
        #celebration-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.8); z-index: 1000;
            justify-content: center; align-items: center; pointer-events: none;
        }
        .barakalla-box { text-align: center; animation: pop 0.5s cubic-bezier(0.17, 0.88, 0.32, 1.27); }
        @keyframes pop { 0% { transform: scale(0); } 100% { transform: scale(1.1); } }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 2000; padding: 20px; }
        .modal-content { background: white; padding: 30px; border-radius: 25px; text-align: center; width: 100%; max-width: 300px; }
    </style>
</head>
<body>

    <div id="celebration-overlay">
        <div class="barakalla-box">
            <div style="font-size: 4rem;">🥳</div>
            <div style="font-size: 2rem; font-weight: bold; color: var(--primary);">BARAKALLA!</div>
        </div>
    </div>

    <div id="menu-screen">
        <h1>🐾 Hayvonlar Akademiyasi</h1>
        <div class="menu-container">
            <button class="menu-btn btn-uy" onclick="initGame('uy')"><span>🏠</span>Uy Hayvonlari</button>
            <button class="menu-btn btn-yovvoyi" onclick="initGame('yovvoyi')"><span>🌳</span>Yovvoyi</button>
            <button class="menu-btn btn-test" onclick="initGame('test')"><span>🎵</span>Ovozli Test</button>
            <button class="menu-btn btn-sort" onclick="initGame('sort')"><span>🔄</span>Saralash</button>
            <button class="menu-btn btn-count" onclick="initGame('count')"><span>⏲️</span>Topishmoq</button>
            <button class="menu-btn btn-shadow" onclick="initGame('shadow')"><span>🌑</span>Soya</button>
        </div>
    </div>

    <div id="game-area">
        <div class="top-bar">
            <button class="back-btn" onclick="goHome()">⬅️</button>
            <h3 id="game-title" style="margin:0; font-size: 1rem; color:var(--primary);"></h3>
            <div style="font-weight:bold;">⭐ <span id="stars">0</span></div>
        </div>

        <div id="shadow-game-view" style="display:none; text-align:center;">
            <div class="shadow-target-box">
                <img id="shadow-main" class="shadow-img" src="" style="filter: brightness(0);">
            </div>
            <div id="shadow-options" class="board"></div>
        </div>

        <div id="standard-board" class="board"></div>

        <div id="sort-board" style="display:none; text-align:center;">
            <p style="font-weight:bold; color:var(--primary);">Qayerda yashaydi?</p>
            <div style="display:flex; gap:15px; margin-bottom:20px;">
                <div class="sort-card btn-uy" onclick="checkSort('uy')">
                    <img src="images/uy_bg.png" alt="Uy"> <span>UYDA</span>
                </div>
                <div class="sort-card btn-yovvoyi" onclick="checkSort('yovvoyi')">
                    <img src="images/ormon_bg.png" alt="O'rmon"> <span>O'RMONDA</span>
                </div>
            </div>
            <div id="sort-target"></div>
        </div>

        <div id="countdown-view" style="display:none; text-align:center;">
            <div id="timer" style="font-size:3rem; font-weight:bold; color:var(--danger); margin-bottom:10px;">10</div>
            <div class="mystery-box"><img id="mystery-img" class="mystery-img" src=""></div>
            <h3 id="reveal-text" style="display:none; color:var(--primary);"></h3>
            <button id="next-btn" class="menu-btn btn-uy" style="margin:15px auto; display:none; width:100%;" onclick="startCountCycle()">Keyingisi ➡️</button>
        </div>
    </div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <h2>O'yin Tugadi!</h2>
            <div id="final-score" style="font-size:2.5rem; font-weight:bold; color:var(--success); margin:15px 0;">0/10</div>
            <button class="menu-btn btn-uy" style="width:100%" onclick="goHome()">Menyoga qaytish</button>
        </div>
    </div>

    <script>
        const animalsData = {
            uy: [
                { id: 'it', name: 'It', audio: 'sounds/it.mp3', nameAudio: 'sounds/it_nomi.mp3', img: 'images/it.png', type: 'uy' },
                { id: 'mushuk', name: 'Mushuk', audio: 'sounds/mushuk.mp3', nameAudio: 'sounds/mushuk_nomi.mp3', img: 'images/mushuk.png', type: 'uy' },
                { id: 'sigir', name: 'Sigir', audio: 'sounds/sigir.mp3', nameAudio: 'sounds/sigir_nomi.mp3', img: 'images/sigir.png', type: 'uy' },
                { id: 'qoy', name: 'Qo\'y', audio: 'sounds/qoy.mp3', nameAudio: 'sounds/qoy_nomi.mp3', img: 'images/qoy.png', type: 'uy' },
                { id: 'ot', name: 'Ot', audio: 'sounds/ot.mp3', nameAudio: 'sounds/ot_nomi.mp3', img: 'images/ot.png', type: 'uy' },
                { id: 'eshak', name: 'Eshak', audio: 'sounds/eshak.mp3', nameAudio: 'sounds/eshak_nomi.mp3', img: 'images/eshak.png', type: 'uy' },
                { id: 'tovuq', name: 'Tovuq', audio: 'sounds/tovuq.mp3', nameAudio: 'sounds/tovuq_nomi.mp3', img: 'images/tovuq.png', type: 'uy' },
                { id: 'ordak', name: 'O\'rdak', audio: 'sounds/ordak.mp3', nameAudio: 'sounds/ordak_nomi.mp3', img: 'images/ordak.png', type: 'uy' },
                { id: 'echki', name: 'Echki', audio: 'sounds/echki.mp3', nameAudio: 'sounds/echki_nomi.mp3', img: 'images/echki.png', type: 'uy' },
                { id: 'quyon', name: 'Quyon', audio: 'sounds/quyon.mp3', nameAudio: 'sounds/quyon_nomi.mp3', img: 'images/quyon.png', type: 'uy' }
            ],
            yovvoyi: [
                { id: 'arslon', name: 'Arslon', audio: 'sounds/arslon.mp3', nameAudio: 'sounds/arslon_nomi.mp3', img: 'images/arslon.png', type: 'yovvoyi' },
                { id: 'fil', name: 'Fil', audio: 'sounds/fil.mp3', nameAudio: 'sounds/fil_nomi.mp3', img: 'images/fil.png', type: 'yovvoyi' },
                { id: 'bori', name: 'Bo\'ri', audio: 'sounds/bori.mp3', nameAudio: 'sounds/bori_nomi.mp3', img: 'images/bori.png', type: 'yovvoyi' },
                { id: 'ayiq', name: 'Ayiq', audio: 'sounds/ayiq.mp3', nameAudio: 'sounds/ayiq_nomi.mp3', img: 'images/ayiq.png', type: 'yovvoyi' },
                { id: 'yolbars', name: 'Yo\'lbars', audio: 'sounds/yolbars.mp3', nameAudio: 'sounds/yolbars_nomi.mp3', img: 'images/yolbars.png', type: 'yovvoyi' },
                { id: 'tulki', name: 'Tulki', audio: 'sounds/tulki.mp3', nameAudio: 'sounds/tulki_nomi.mp3', img: 'images/tulki.png', type: 'yovvoyi' },
                { id: 'maymun', name: 'Maymun', audio: 'sounds/maymun.mp3', nameAudio: 'sounds/maymun_nomi.mp3', img: 'images/maymun.png', type: 'yovvoyi' },
                { id: 'jirafa', name: 'Jirafa', audio: 'sounds/jirafa.mp3', nameAudio: 'sounds/jirafa_nomi.mp3', img: 'images/jirafa.png', type: 'yovvoyi' },
                { id: 'zebra', name: 'Zebra', audio: 'sounds/zebra.mp3', nameAudio: 'sounds/zebra_nomi.mp3', img: 'images/zebra.png', type: 'yovvoyi' },
                { id: 'begemot', name: 'Begemot', audio: 'sounds/begemot.mp3', nameAudio: 'sounds/begemot_nomi.mp3', img: 'images/begemot.png', type: 'yovvoyi' }
            ]
        };

        let score = 0, turn = 0, targetAnimal = null, gameList = [], timerInterval, currentMode;
        const allAnimals = [...animalsData.uy, ...animalsData.yovvoyi];

        function shuffle(array) { return array.sort(() => Math.random() - 0.5); }

        function showCelebration() {
            const overlay = document.getElementById('celebration-overlay');
            overlay.style.display = 'flex';
            setTimeout(() => { overlay.style.display = 'none'; }, 1500);
        }

        function initGame(mode) {
            currentMode = mode; score = 0; turn = 0;
            document.getElementById('stars').innerText = "0";
            document.getElementById('menu-screen').style.display = 'none';
            document.getElementById('game-area').style.display = 'block';
            
            // Barcha qismlarni yashirish
            ['standard-board', 'sort-board', 'countdown-view', 'shadow-game-view'].forEach(id => {
                document.getElementById(id).style.display = 'none';
            });

            if(mode === 'uy' || mode === 'yovvoyi') {
                gameList = shuffle([...animalsData[mode]]);
                document.getElementById('game-title').innerText = "Tanishuv";
                document.getElementById('standard-board').style.display = 'grid';
                renderStandard();
            } else if(mode === 'test') {
                document.getElementById('game-title').innerText = "Ovozni top";
                gameList = shuffle(allAnimals).slice(0, 10);
                document.getElementById('standard-board').style.display = 'grid';
                startQuiz();
            } else if(mode === 'sort') {
                document.getElementById('game-title').innerText = "Saralash";
                document.getElementById('sort-board').style.display = 'block';
                gameList = shuffle(allAnimals).slice(0, 10);
                showNextSort();
            } else if(mode === 'count') {
                document.getElementById('game-title').innerText = "Topishmoq";
                document.getElementById('countdown-view').style.display = 'block';
                gameList = shuffle(allAnimals).slice(0, 10);
                startCountCycle();
            } else if(mode === 'shadow') {
                document.getElementById('game-title').innerText = "Soyani top";
                document.getElementById('shadow-game-view').style.display = 'block';
                gameList = shuffle(allAnimals).slice(0, 10);
                showNextShadow();
            }
        }

        function renderStandard() {
            const board = document.getElementById('standard-board');
            board.innerHTML = '';
            let list = (currentMode === 'test') ? shuffle([...gameList]) : gameList;
            list.forEach(a => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `<img src="${a.img}"><p>${a.name}</p>`;
                card.onclick = () => handleCardClick(a, card);
                board.appendChild(card);
            });
        }

        function handleCardClick(animal, el) {
            if(currentMode === 'test') {
                if(animal.id === targetAnimal.id) {
                    el.style.borderColor = "var(--success)"; score++;
                    document.getElementById('stars').innerText = score;
                    playAudio('sounds/barakalla.mp3'); showCelebration();
                    setTimeout(() => { turn++; startQuiz(); }, 2000);
                } else { playAudio('sounds/notogri.mp3'); el.style.borderColor = "var(--danger)"; setTimeout(()=> el.style.borderColor="transparent", 500); }
            } else {
                playAudio(animal.nameAudio);
                setTimeout(() => playAudio(animal.audio), 1500);
            }
        }

        function showNextSort() {
            if(turn >= 10) { finishGame(); return; }
            targetAnimal = gameList[turn];
            document.getElementById('sort-target').innerHTML = `<div class="card" style="width:160px; margin:auto;"><img src="${targetAnimal.img}"><p>${targetAnimal.name}</p></div>`;
            playAudio(targetAnimal.nameAudio);
        }

        function checkSort(type) {
            if(type === targetAnimal.type) { 
                playAudio('sounds/barakalla.mp3'); showCelebration(); score++; 
            } else { playAudio('sounds/notogri.mp3'); }
            document.getElementById('stars').innerText = score;
            turn++; setTimeout(showNextSort, 2000);
        }

        function showNextShadow() {
            if(turn >= 10) { finishGame(); return; }
            targetAnimal = gameList[turn];
            const shadowImg = document.getElementById('shadow-main');
            shadowImg.src = targetAnimal.img;
            shadowImg.style.filter = "brightness(0)";

            const optionsBoard = document.getElementById('shadow-options');
            optionsBoard.innerHTML = '';
            let others = shuffle(allAnimals.filter(a => a.id !== targetAnimal.id)).slice(0, 3);
            let choices = shuffle([targetAnimal, ...others]);

            choices.forEach(a => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `<img src="${a.img}"><p>${a.name}</p>`;
                card.onclick = () => {
                    if(a.id === targetAnimal.id) {
                        shadowImg.style.filter = "brightness(1)";
                        playAudio('sounds/barakalla.mp3'); showCelebration();
                        score++; document.getElementById('stars').innerText = score;
                        setTimeout(() => { turn++; showNextShadow(); }, 2000);
                    } else { playAudio('sounds/notogri.mp3'); }
                };
                optionsBoard.appendChild(card);
            });
        }

        function startQuiz() {
            if(turn >= 10) { finishGame(); return; }
            targetAnimal = gameList[turn]; renderStandard(); 
            playAudio('sounds/savol_ovoz.mp3');
            setTimeout(() => playAudio(targetAnimal.audio), 2500);
        }

        function startCountCycle() {
            if(turn >= 10) { finishGame(); return; }
            clearInterval(timerInterval);
            let count = 10; targetAnimal = gameList[turn];
            const img = document.getElementById('mystery-img');
            img.classList.remove('reveal'); img.classList.add('blur');
            img.src = targetAnimal.img; img.style.opacity = '0.4';
            document.getElementById('reveal-text').style.display = 'none';
            document.getElementById('next-btn').style.display = 'none';
            document.getElementById('timer').innerText = count;

            playAudio('sounds/savol_sanoq.mp3');
            timerInterval = setInterval(() => {
                count--;
                document.getElementById('timer').innerText = count;
                if(count <= 0) { clearInterval(timerInterval); revealAnimal(); }
            }, 1000);
        }

        function revealAnimal() {
            const img = document.getElementById('mystery-img');
            img.classList.remove('blur'); img.classList.add('reveal');
            playAudio(targetAnimal.nameAudio);
            document.getElementById('reveal-text').innerText = "Bu — " + targetAnimal.name + "!";
            document.getElementById('reveal-text').style.display = 'block';
            document.getElementById('next-btn').style.display = 'block';
            turn++;
        }

        function finishGame() {
            document.getElementById('final-score').innerText = `${score}/${turn}`;
            document.getElementById('modal').style.display = 'flex';
        }

        function playAudio(src) { new Audio(src).play().catch(e => console.log("Audio xatosi")); }
        function goHome() { location.reload(); }
    </script>
</body>
</html>
